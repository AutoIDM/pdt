# Lists active Monday users who have no active Entra ID account.

# How often this app runs.
# Shorthand: hourly, daily, weekly, monthly, yearly.
# Or a 5-field cron expression, for example "0 * * * *".
schedule: "daily"

config:
  # Monday API 2026-07 supports page/limit pagination, with at most 1000
  # users per request.
  monday_page_size: 1000

  # The title of the alert orphaned-accounts:found, which carries the findings.
  # To get it by email, in Slack, or in Teams, add orphaned-accounts:found to the
  # events of an entry under alerts: in the project's pdt.yml (pdt alerts setup).
  subject: Unmatched Accounts Report - Monday users missing from Entra ID

# The Entra app needs User.Read.All (application) plus admin consent.
env:
  required:
    - PDT_MONDAY_API_TOKEN
    - PDT_AZURE_TENANT_ID
    - PDT_AZURE_CLIENT_ID
  one_of:
    - [PDT_AZURE_CLIENT_SECRET]
    - [PDT_AZURE_PRIVATE_KEY_B64]
    - [PDT_AZURE_PRIVATE_KEY_PATH]
  optional:
    - PDT_AZURE_PRIVATE_KEY_PASSWORD
