# Turns every Closed Won Salesforce opportunity into a NetSuite sales order and invoice.

# How often this app runs.
# Shorthand: hourly, daily, weekly, monthly, yearly.
# Or a 5-field cron expression, for example "0 * * * *".
schedule: "*/5 * * * *"

config:
  # Which Meltano environment run.py uses. `dev` points at a sandbox
  # Salesforce org and a NetSuite sandbox account. `prod` points at both
  # production systems. `ci` is for merge request testing.
  meltano_environment: prod

  # The three Salesforce custom fields on Opportunity that receive the
  # NetSuite ids. Create them yourself as Text(18) fields, then put their
  # API names here. A stock Salesforce org has none of them.
  # Change a name here and change the matching key in the target-salesforce
  # stream_maps block in meltano.yml, because a Singer stream map key
  # cannot read a config value. README.md explains why.
  netsuite_customer_id_field: NetSuite_Customer_Id__c
  netsuite_sales_order_id_field: NetSuite_Sales_Order_Id__c
  netsuite_invoice_id_field: NetSuite_Invoice_Id__c

# Env vars the app needs. `pdt validate` checks them against your .env,
# and `pdt deploy` uploads the ones that are set as cloud secrets.
# Every name here is the name Meltano already looks for, so run.py hands
# the environment to Meltano unchanged.
env:
  required:
    # NetSuite read. The integration record needs REST Web Services and
    # OAuth 2.0 client credentials with a certificate.
    - TAP_NETSUITE_ACCOUNT_ID
    - TAP_NETSUITE_CLIENT_ID
    - TAP_NETSUITE_CERTIFICATE_ID
    - TAP_NETSUITE_PRIVATE_KEY
    # NetSuite write. The same integration record works for both.
    - TARGET_NETSUITE_ACCOUNT_ID
    - TARGET_NETSUITE_CLIENT_ID
    - TARGET_NETSUITE_CERTIFICATE_ID
    - TARGET_NETSUITE_PRIVATE_KEY
    # Postgres holds the staging tables between Salesforce and NetSuite.
    # Example: postgresql://postgres:PASSWORD@localhost:5432
    - POSTGRES_SQLALCHEMY_URL_NO_DB
  # Salesforce accepts either sign-in mode. This app reads Salesforce and
  # writes back to it, so pick one mode and set it for both.
  one_of:
    - [TAP_SALESFORCE_USERNAME, TAP_SALESFORCE_PASSWORD, TAP_SALESFORCE_SECURITY_TOKEN,
       TARGET_SALESFORCE_USERNAME, TARGET_SALESFORCE_PASSWORD, TARGET_SALESFORCE_SECURITY_TOKEN]
    - [TAP_SALESFORCE_CLIENT_ID, TAP_SALESFORCE_CLIENT_SECRET, TAP_SALESFORCE_REFRESH_TOKEN,
       TARGET_SALESFORCE_CLIENT_ID, TARGET_SALESFORCE_CLIENT_SECRET, TARGET_SALESFORCE_REFRESH_TOKEN]
  optional:
    - TAP_SALESFORCE_START_DATE
    # Set this only when your org uses a My Domain host. Each Meltano
    # environment already picks `login` or `test`.
    - TARGET_SALESFORCE_DOMAIN
    - TAP_POSTGRES_HOST
    - TAP_POSTGRES_PORT
    - TAP_POSTGRES_USER
    - TAP_POSTGRES_PASSWORD
    - TAP_POSTGRES_DATABASE
    - TARGET_POSTGRES_HOST
    - TARGET_POSTGRES_PORT
    - TARGET_POSTGRES_USER
    - TARGET_POSTGRES_PASSWORD
    - TARGET_POSTGRES_DATABASE
    - DBT_HOST
    - DBT_PORT
    - DBT_USER
    - DBT_PASSWORD
    - DBT_DBNAME
    - TARGET_APPRISE_URIS
