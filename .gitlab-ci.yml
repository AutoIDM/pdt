# GitLab is for internal build & test. GitHub Actions is for publishing to PyPI.

default:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  interruptible: true
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache

variables:
  UV_CACHE_DIR: .uv-cache
  # Job logs are pipes, so Python would hold output until a job ends and a
  # running job would show nothing. This makes every job log live.
  PYTHONUNBUFFERED: "1"

# A schedule or web run sets the `mode` variable to pick one task job; the
# build and test jobs skip such a pipeline.
stages:
  - test
  - tasks

# The score-mrs webhook calls the pipeline trigger API for every merge
# request event, and its custom template passes the event's action and
# Draft change as variables. These rules let a trigger pipeline exist only
# when the MR opens or leaves Draft; for any other event (a push, a rebase,
# a label, an edit, a close) no pipeline is created at all. Every other
# pipeline source is untouched.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE != "trigger"
    - if: $MR_ACTION == "open"
    - if: $MR_ACTION == "reopen"
    - if: $MR_ACTION == "update" && $MR_DRAFT_BEFORE == "true" && $MR_DRAFT_AFTER == "false"

test:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.12", "3.13"]
  script:
    - uv run --python "$PYTHON_VERSION" --group dev pytest -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $mode == null
    - if: $CI_COMMIT_TAG

lint:
  stage: test
  script:
    - uv run --group dev ruff check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $mode == null
    - if: $CI_COMMIT_TAG

smoke:
  stage: test
  script:
    - uv run --python 3.12 python scripts/smoke.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $mode == null
    - if: $CI_COMMIT_TAG

# Runs one Claude Code task from ci/claude-tasks/<CLAUDE_TASK>/ on the team's
# Claude subscription. A job extends this and sets CLAUDE_TASK plus its own
# rules. Needs the masked, protected variables CLAUDE_TOKEN (from
# `claude setup-token`) and GITLAB_TOKEN (project access token, api +
# write_repository). How to create them is in the handbook, developer.md,
# "Claude Code in CI". Exit code 2 means an item needs a person: the job
# shows a warning, not a failure. A bad token exits 1 and fails the job.
# A rule may set CLAUDE_TASK_ARGS, for example "--dry-run".
.claude-task:
  stage: tasks
  interruptible: false
  variables:
    GIT_DEPTH: 0
    GIT_EDITOR: "true"
  allow_failure:
    exit_codes: [2]
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl ca-certificates
    - curl -fsSL https://claude.ai/install.sh | bash -s 2.1.266
    - export PATH="$HOME/.local/bin:$PATH"
    - export CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_TOKEN"
  script:
    - uv run --python 3.13 python ci/claude_task.py "$CLAUDE_TASK" $CLAUDE_TASK_ARGS
  artifacts:
    when: always
    paths:
      - claude-task-report/
    expire_in: 30 days

# After every merge to the default branch, Claude rebases each open MR onto
# it. Label an MR `no-autorebase` to leave it alone. A pipeline that sets the
# `mode` variable (a schedule or web run picking one job) does not rebase.
rebase-mrs:
  extends: .claude-task
  needs: []
  resource_group: rebase-mrs
  variables:
    CLAUDE_TASK: rebase-mrs
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $mode == null

# Scores every open MR into tier::simple / tier::review / tier::architectural,
# comments the reasons, and merges a tier::simple MR once its pipeline passes.
# Runs on a master pipeline whose `mode` variable is score_mrs: a project
# webhook on merge request events triggers one (see the handbook, "Claude
# Code in CI"), and a daily schedule sweeps everything. The webhook's template
# sets MR_IID, so a webhook run scores that MR alone; the `workflow` rules at
# the top decide which events get a pipeline. A web run with mode=score_mrs
# lists what it would do and changes nothing unless the form also sets
# DRY_RUN=false.
score-mrs:
  extends: .claude-task
  needs: []
  resource_group: score-mrs
  variables:
    CLAUDE_TASK: score-mrs
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" && $mode == "score_mrs"
      variables:
        DRY_RUN: "false"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $mode == "score_mrs"
      variables:
        DRY_RUN: "false"
    - if: $CI_PIPELINE_SOURCE == "web" && $mode == "score_mrs" && $DRY_RUN == "false"
    - if: $CI_PIPELINE_SOURCE == "web" && $mode == "score_mrs"
      variables:
        CLAUDE_TASK_ARGS: "--dry-run"

# Scheduled and manual pipelines pick a job with the `mode` variable, so each
# schedule sets mode to the job it wants. A schedule runs armed; a web run is a
# dry run unless the form also sets DRY_RUN=false.
# Needs GITLAB_TOKEN and SLACK_WEBHOOK_URL.
close_stale_drafts:
  stage: tasks
  needs: []
  interruptible: false
  script:
    - uv run python ci/close_stale_drafts.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $mode == "close_stale_drafts"
      variables:
        DRY_RUN: "false"
    - if: $CI_PIPELINE_SOURCE == "web" && $mode == "close_stale_drafts"
