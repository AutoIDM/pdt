# One row per deploy target under test. Two apps per provider, so
# every shared resource is used by more than one app while one is destroyed.
# The a app is plain. The b app carries the loaded combination: a cron
# schedule (the run replaces it with a time a few minutes out), storage off,
# a one_of env group, its own Dockerfile, and a non-UTC timezone where the
# provider allows one.
apps:
  - name: aws-fargate-a
    schedule: daily
    platform:
      provider: aws
      region: us-east-1
  - name: aws-fargate-b
    schedule: "30 6 * * *"
    timezone: America/New_York
    platform:
      provider: aws
      region: us-east-1
  - name: azure-container-apps-a
    schedule: daily
    platform:
      provider: azure
      region: eastus2
      resource_group: pdt-verify
  - name: azure-container-apps-b
    schedule: "30 6 * * *"
    platform:
      provider: azure
      region: eastus2
      resource_group: pdt-verify
  - name: google-cloud-a
    schedule: daily
    platform:
      provider: google-cloud
      region: us-central1
  - name: google-cloud-b
    schedule: "30 6 * * *"
    timezone: America/New_York
    platform:
      provider: google-cloud
      region: us-central1
  - name: windows-a
    schedule: daily
    timezone: local
    platform:
      provider: windows
  - name: windows-b
    schedule: "30 6 * * *"
    timezone: local
    platform:
      provider: windows
