[project]
name = "pdt-cli"
version = "0.1.4"
description = "Easily deploy your process to AWS, Azure, Google Cloud, or Windows."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pyyaml",
    "rich",
    "python-dotenv",
    "msal",
    "google-auth",
    "google-auth-oauthlib",
    "backoff",
    "rich-argparse>=1.8.0",
    "argcomplete",
    "shellingham",
]

[project.optional-dependencies]
apps = [
    "cryptography",
    "pyjwt",
    "boto3",
    "google-cloud-secret-manager",
    "fsspec",
    "s3fs>=2024",
    "gcsfs",
    "adlfs",
    "google-cloud-storage",
    "azure-storage-blob",
    "azure-identity",
    "azure-keyvault-secrets",
]

[project.scripts]
pdt = "pdt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdt"]

[tool.hatch.build.targets.sdist]
include = ["src/pdt", "README.md", "tests"]

[dependency-groups]
dev = ["pytest", "ruff", "fsspec", "boto3"]

[tool.pytest.ini_options]
testpaths = ["tests", "ci/tests"]

[tool.ruff]
include = ["src/**/*.py"]
extend-exclude = ["src/pdt/examples"]

[tool.ruff.lint]
select = ["T20", "F821"]

[tool.ruff.lint.per-file-ignores]
"src/pdt/utils/log.py" = ["T20"]
"src/pdt/utils/send_email.py" = ["T20"]
