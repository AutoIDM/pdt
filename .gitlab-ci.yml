# GitLab is for internal build & test. GitHub Actions is for publishing to PyPI.

default:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  interruptible: true
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache

variables:
  UV_CACHE_DIR: .uv-cache

stages:
  - test

test:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.12", "3.13"]
  script:
    - uv run --python "$PYTHON_VERSION" --group dev pytest -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

smoke:
  stage: test
  script:
    - uv run --python 3.12 python scripts/smoke.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
