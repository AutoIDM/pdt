# One row per deploy target under test. Two apps per provider, so
# every shared resource is used by more than one app while one is destroyed.
apps:
  - name: aws-fargate-a
    schedule: daily
    platform:
      provider: aws
      region: us-east-1
  - name: aws-fargate-b
    schedule: daily
    platform:
      provider: aws
      region: us-east-1
  # The subscription allows one Container Apps environment per region, and
  # eastus2 already holds one from another project.
  - name: azure-container-apps-a
    schedule: daily
    platform:
      provider: azure
      region: centralus
      resource_group: pdt-verify
  - name: azure-container-apps-b
    schedule: daily
    platform:
      provider: azure
      region: centralus
      resource_group: pdt-verify
  - name: google-cloud-a
    schedule: daily
    platform:
      provider: google-cloud
      region: us-central1
  - name: google-cloud-b
    schedule: daily
    platform:
      provider: google-cloud
      region: us-central1
  - name: windows-a
    schedule: daily
    timezone: local
    platform:
      provider: windows
  - name: windows-b
    schedule: daily
    timezone: local
    platform:
      provider: windows
