[project]
name = "pdt-cli"
version = "0.1.0"
description = "Validate, run, and deploy small scheduled jobs to AWS, Azure, Google Cloud, or Windows."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pyyaml",
    "python-dotenv",
    "msal",
    "google-auth",
    "google-auth-oauthlib",
]

[project.optional-dependencies]
apps = [
    "cryptography",
    "pyjwt",
    "boto3",
    "google-cloud-secret-manager",
]

[project.scripts]
pdt = "pdt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdt"]

[tool.hatch.build.targets.sdist]
include = ["src/pdt", "README.md", "tests"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
