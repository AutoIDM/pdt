# GitLab is for internal build & test. GitHub Actions is for publishing to PyPI.

default:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  interruptible: true
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache

variables:
  UV_CACHE_DIR: .uv-cache
  CLAUDE_CLI_VERSION: "2.1.266"
  # Job logs are pipes, so Python would hold output until a job ends and a
  # running job would show nothing. This makes every job log live.
  PYTHONUNBUFFERED: "1"

# A schedule or web run sets the `mode` variable to pick one task job; the
# build and test jobs skip such a pipeline.
stages:
  - test
  - verify
  - tasks

include:
  - local: verify/.gitlab-ci.yml

# Every job in the test stage sets `needs: []` so it starts as soon as the
# pipeline does, and `smoke` needs only `build`, so no job waits for a stage.
build:
  stage: test
  needs: []
  script:
    - uv build --wheel
  artifacts:
    paths:
      - dist/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $mode == null
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG

# Tests run on 3.12, the minimum in pyproject.toml, so a newer-only feature
# fails here before it reaches a user on the minimum version.
test:
  stage: test
  needs: []
  script:
    - uv run --python 3.12 --group dev pytest -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $mode == null
    - if: $CI_COMMIT_TAG

lint:
  stage: test
  needs: []
  script:
    - uv run --group dev ruff check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $mode == null
    - if: $CI_COMMIT_TAG

# Installs the wheel the build job made, so the wheel is built once per
# pipeline. Without an argument the script builds its own wheel.
smoke:
  stage: test
  needs: [build]
  script:
    - uv run --python 3.12 python scripts/smoke.py dist/*.whl
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $mode == null
    - if: $CI_COMMIT_TAG

# Runs the pdt-examples pipeline against this commit and takes its result, so
# a pdt change that breaks a customer-shaped app fails here. On a merge
# request, pdt-examples tests its branch of the same name when one exists.
examples:
  stage: verify
  needs: []
  variables:
    PDT_REF: $CI_COMMIT_SHA
    PDT_BRANCH: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
  trigger:
    project: autoidm/pdt-examples
    branch: master
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $mode == null
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Runs one Claude Code task from ci/claude-tasks/<CLAUDE_TASK>/ on the team's
# Claude subscription. A job extends this and sets CLAUDE_TASK plus its own
# rules. Needs the masked, protected variables CLAUDE_TOKEN (from
# `claude setup-token`) and GITLAB_TOKEN (project access token, api +
# write_repository). How to create them is in the handbook, developer.md,
# "Claude Code in CI". Exit code 2 means an item needs a person: the job
# shows a warning, not a failure. A bad token exits 1 and fails the job.
# A rule may set CLAUDE_TASK_ARGS, for example "--dry-run".
# The full (not slim) image ships git and curl, so no apt-get runs. The Claude
# binary is copied into the project and cached under its version, so a run
# downloads it only when CLAUDE_CLI_VERSION changes.
.claude-task:
  stage: tasks
  image: ghcr.io/astral-sh/uv:python3.13-bookworm
  interruptible: false
  variables:
    GIT_DEPTH: 0
    GIT_EDITOR: "true"
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - .uv-cache
    - key: claude-cli-$CLAUDE_CLI_VERSION
      paths:
        - .claude-cli/
  allow_failure:
    exit_codes: [2]
  before_script:
    - >
      if [ ! -x .claude-cli/claude ]; then
      curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CLI_VERSION"
      && mkdir -p .claude-cli && cp -L "$HOME/.local/bin/claude" .claude-cli/claude;
      fi
    - export PATH="$PWD/.claude-cli:$PATH"
    - claude --version
    - export CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_TOKEN"
  script:
    - uv run --python 3.13 python ci/claude_task.py "$CLAUDE_TASK" $CLAUDE_TASK_ARGS
  artifacts:
    when: always
    paths:
      - claude-task-report/
    expire_in: 30 days

# After every merge to the default branch, Claude rebases each open MR onto
# it. Label an MR `no-autorebase` to leave it alone. A pipeline that sets the
# `mode` variable (a schedule or web run picking one job) does not rebase.
rebase-mrs:
  extends: .claude-task
  needs: []
  resource_group: rebase-mrs
  variables:
    CLAUDE_TASK: rebase-mrs
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $mode == null

# Scores every open MR into tier::simple / tier::review / tier::architectural,
# comments the reasons, and merges a tier::simple MR once its pipeline passes.
# Runs on a master pipeline whose `mode` variable is score_mrs: a project
# webhook on merge request events triggers one (see the handbook, "Claude
# Code in CI"), and a daily schedule sweeps everything. The webhook's template
# sets MR_IID, MR_ACTION, MR_DRAFT_BEFORE and MR_DRAFT_AFTER, so a webhook
# run scores that MR alone, and only when the event is the MR opening or
# leaving Draft. A web run with mode=score_mrs lists what it would do and
# changes nothing unless the form also sets DRY_RUN=false.
score-mrs:
  extends: .claude-task
  needs: []
  resource_group: score-mrs
  variables:
    CLAUDE_TASK: score-mrs
  rules:
    # The three merge request events that score: the MR opens, reopens, or
    # leaves Draft. The webhook's template renders a missing Draft change as
    # the word null, so a push, a rebase, a label, an edit, or a close never
    # matches; those events run score-mrs-skip instead.
    - if: $CI_PIPELINE_SOURCE == "trigger" && $mode == "score_mrs" && $MR_ACTION == "open"
      variables:
        DRY_RUN: "false"
    - if: $CI_PIPELINE_SOURCE == "trigger" && $mode == "score_mrs" && $MR_ACTION == "reopen"
      variables:
        DRY_RUN: "false"
    - if: $CI_PIPELINE_SOURCE == "trigger" && $mode == "score_mrs" && $MR_ACTION == "update" && $MR_DRAFT_BEFORE == "true" && $MR_DRAFT_AFTER == "false"
      variables:
        DRY_RUN: "false"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $mode == "score_mrs"
      variables:
        DRY_RUN: "false"
    - if: $CI_PIPELINE_SOURCE == "web" && $mode == "score_mrs" && $DRY_RUN == "false"
    - if: $CI_PIPELINE_SOURCE == "web" && $mode == "score_mrs"
      variables:
        CLAUDE_TASK_ARGS: "--dry-run"

# Every other merge request event the webhook sends (a push, a rebase, a
# label, an edit, an approval, a close, a merge) lands here. The pipeline
# has to exist: the trigger API answers HTTP 400 when no job matches or
# workflow rules filter the pipeline out, GitLab counts every 4xx as a
# webhook failure, disables the hook after four in a row, and drops the
# events that arrive while it is disabled. So this job runs instead, does
# nothing, and clones nothing. Its rules mirror score-mrs, negated. Do not
# filter trigger pipelines with workflow rules.
score-mrs-skip:
  stage: tasks
  image: alpine:3.20
  needs: []
  cache: []
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Merge request !$MR_IID sent a $MR_ACTION event. Nothing to score."
  rules:
    - if: $CI_PIPELINE_SOURCE != "trigger"
      when: never
    - if: $mode != "score_mrs"
      when: never
    - if: $MR_ACTION == "open"
      when: never
    - if: $MR_ACTION == "reopen"
      when: never
    - if: $MR_ACTION == "update" && $MR_DRAFT_BEFORE == "true" && $MR_DRAFT_AFTER == "false"
      when: never
    - when: on_success

# Scheduled and manual pipelines pick a job with the `mode` variable, so each
# schedule sets mode to the job it wants. A schedule runs armed; a web run is a
# dry run unless the form also sets DRY_RUN=false.
# Needs GITLAB_TOKEN and SLACK_WEBHOOK_URL.
close_stale_drafts:
  stage: tasks
  needs: []
  interruptible: false
  script:
    - uv run python ci/close_stale_drafts.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $mode == "close_stale_drafts"
      variables:
        DRY_RUN: "false"
    - if: $CI_PIPELINE_SOURCE == "web" && $mode == "close_stale_drafts"
