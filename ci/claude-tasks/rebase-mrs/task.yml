# Resolve the open merge requests that conflict with the default branch
# after a merge. select_mrs.py tries each rebase with git alone, pushes
# nothing, and lists only the ones that conflict; Claude resolves those,
# runs the tests, and pushes; check_mrs.py verifies each push and comments.
# parallel is kept small: every session draws on the one subscription's
# rate limit, and a conflict session runs two to four minutes.
model: opus
budget_usd: 20
timeout_minutes: 30
parallel: 4
permission_mode: acceptEdits
select: select_mrs.py
check: check_mrs.py
allowed_tools:
  - Read
  - Edit
  - Write
  - Grep
  - Glob
  - "Bash(git status*)"
  - "Bash(git diff*)"
  - "Bash(git log*)"
  - "Bash(git show*)"
  - "Bash(git checkout*)"
  - "Bash(git rebase*)"
  - "Bash(git add *)"
  - "Bash(git push --force-with-lease*)"
  - "Bash(uv run *)"
disallowed_tools:
  - "Bash(git reset*)"
  - "Bash(git commit --amend*)"
  - "Bash(git push -f*)"
  - "Bash(git push --force origin*)"
