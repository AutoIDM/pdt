# Tests run on Windows and macOS too, because pdt targets Windows Task
# Scheduler.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.15"
          - os: windows-latest
            python: "3.12"
            files: a-d
          - os: windows-latest
            python: "3.12"
            files: e-z
    env:
      UV_COMPILE_BYTECODE: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} --group dev pytest -q -m "" ${{ matrix.files && format('--ignore-glob=*/test_{0}*', matrix.files == 'a-d' && '[!a-d]' || '[a-d]') || '' }}

  # macOS runners often wait many minutes for a machine, so a pull request
  # does not wait for this job.
  test-macos:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        files: [a-d, e-z]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.13"
      - run: uv run --python 3.13 --group dev pytest -q -m "" ${{ format('--ignore-glob=*/test_{0}*', matrix.files == 'a-d' && '[!a-d]' || '[a-d]') }}

  # tests/ needs no network, so this job downloads the IntuneManagement that
  # tests/test_intune_export.py runs. On a pull request it runs only when the
  # Intune export changes; the job itself always runs, so it always reports.
  intune:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        run: |
          if [ "${{ github.event_name }}" != pull_request ] ||
             git diff --name-only HEAD^1 HEAD | grep -qE '^(src/pdt/examples/intune-export/|tests/intune_export/|tests/test_intune_export\.py$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - id: module
        if: steps.changes.outputs.run == 'true'
        run: |
          script=src/pdt/examples/intune-export/IntuneExport.ps1
          echo "commit=$(sed -n "s/^[$]commit = '\(.*\)'$/\1/p" $script)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sed -n "s/^[$]archiveSha256 = '\(.*\)'$/\1/p" $script)" >> "$GITHUB_OUTPUT"
      - id: cache
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pdt/IntuneManagement-${{ steps.module.outputs.commit }}
          key: intune-management-${{ steps.module.outputs.commit }}
      - if: steps.changes.outputs.run == 'true' && steps.cache.outputs.cache-hit != 'true'
        env:
          COMMIT: ${{ steps.module.outputs.commit }}
          SHA256: ${{ steps.module.outputs.sha256 }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/archive.zip" "https://github.com/Micke-K/IntuneManagement/archive/$COMMIT.zip"
          echo "${SHA256,,}  $RUNNER_TEMP/archive.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/archive.zip" -d "$RUNNER_TEMP"
          mkdir -p ~/.local/share/pdt
          mv "$RUNNER_TEMP/IntuneManagement-$COMMIT" ~/.local/share/pdt/
      - if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.13"
      - if: steps.changes.outputs.run == 'true'
        run: uv run --python 3.13 --group dev pytest -q -m "" tests/test_intune_export.py
        env:
          PDT_TEST_INTUNE: "1"

  smoke:
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv run --python 3.12 python scripts/smoke.py

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv run --group dev ruff check

  # Fails on an Error finding or a security rule finding; other findings only print.
  powershell-lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - shell: pwsh
        run: |
          Install-PSResource PSScriptAnalyzer -Version 1.25.0 -Repository PSGallery -TrustRepository
          $security = 'PSAvoidUsingInvokeExpression', 'PSAvoidUsingPlainTextForPassword', 'PSAvoidUsingConvertToSecureStringWithPlainText', 'PSAvoidUsingUsernameAndPasswordParams', 'PSAvoidUsingBrokenHashAlgorithms', 'PSAvoidUsingAllowUnencryptedAuthentication'
          $findings = git ls-files '*.ps1' | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ }
          $findings | Format-Table -AutoSize ScriptName, Line, Severity, RuleName, Message | Out-String -Width 400
          $failed = @($findings | Where-Object { $_.Severity -eq 'Error' -or $_.RuleName -in $security })
          if ($failed) { throw "$($failed.Count) PowerShell finding(s) of Error severity or a security rule." }

  # Everything the verify matrix can prove without a cloud account.
  verify-check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv run --no-project --with pyyaml python verify/scripts/sync_apps.py --check
      - run: uv run pdt validate
        env:
          PDT_PROJECT: verify
          PDT_SMOKE_TOKEN: pdt-verify
