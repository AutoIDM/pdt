# Score every open merge request into tier::simple, tier::review, or
# tier::architectural. select_mrs.py sets a floor from path rules and merges
# simple MRs scored on an earlier run; Claude reads the diff and may raise the
# floor; check_mrs.py labels the MR, comments the reasons, and merges a
# simple MR right away when its pipeline passed.
model: opus
budget_usd: 2
timeout_minutes: 10
# A daily sweep scores every open MR. Sessions are read-only and short, so
# four at a time keeps a sweep of 15 MRs under five minutes.
parallel: 4
permission_mode: dontAsk
select: select_mrs.py
check: check_mrs.py
allowed_tools:
  - Read
  - Grep
  - Glob
  - "Bash(git diff*)"
  - "Bash(git log*)"
  - "Bash(git show*)"
disallowed_tools:
  - Edit
  - Write
  - "Bash(git push*)"
  - "Bash(git checkout*)"
