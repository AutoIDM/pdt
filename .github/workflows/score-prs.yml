# Scores open pull requests into tier::simple, tier::review, or
# tier::architectural with the ci/claude-tasks/score-prs task, and merges a
# scored tier::simple PR once every check on its head commit passed.
# A pull_request event scores that PR alone. The schedule sweeps every open
# PR. A manual run is a dry run unless its dry_run box is cleared. When a ci
# run of a PR from this repository succeeds, the merge job tries the merge of
# that PR alone: it runs no Claude and scores nothing. A pull_request run also
# tries the merge after it scores, for a PR whose ci finished first.
# Needs the secret CLAUDE_TOKEN (from `claude setup-token`). The optional
# secret PDT_BOT_TOKEN merges as a user, because a merge made with
# GITHUB_TOKEN starts no workflow on the default branch.

name: score-prs

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would change, and change nothing
        type: boolean
        default: true
  workflow_run:
    workflows: [ci]
    types: [completed]

# A merge attempt has its own group, so it never replaces a pending scoring
# run, and a scoring run never replaces a pending merge attempt.
concurrency:
  group: ${{ github.event_name == 'workflow_run' && format('score-prs-merge-{0}', github.event.workflow_run.head_sha) || 'score-prs' }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read

env:
  CLAUDE_CLI_VERSION: "2.1.266"
  PYTHONUNBUFFERED: "1"

jobs:
  # select_prs.py finds this job's own check run by this id (OWN_CHECK).
  # GitHub gives a Dependabot pull_request run no Actions secrets, so that run
  # skips and the daily sweep scores the PR.
  score-prs:
    if: github.event_name != 'workflow_run' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.PDT_BOT_TOKEN || github.token }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      # A pull_request run would check out the PR itself, so the PR could
      # change the rules that score and merge it. The rules come from the
      # default branch instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.claude-cli
          key: claude-cli-${{ env.CLAUDE_CLI_VERSION }}
      - name: Install Claude Code
        run: |
          if [ ! -x ~/.claude-cli/claude ]; then
            curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CLI_VERSION"
            mkdir -p ~/.claude-cli && cp -L ~/.local/bin/claude ~/.claude-cli/claude
          fi
          echo "$HOME/.claude-cli" >> "$GITHUB_PATH"
      - run: claude --version
      # Exit 2 means a PR needs a person. claude_task.py printed a ::warning::
      # for it, and the job stays green.
      - name: Score pull requests
        run: >
          uv run --python 3.13 python ci/claude_task.py score-prs
          ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }} || [ $? -eq 2 ]
      - name: Try the merge of the scored pull request
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 ci/claude-tasks/score-prs/select_prs.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: claude-task-report
          path: claude-task-report/
          retention-days: 30
          if-no-files-found: ignore

  # A workflow_run job has the secrets, so it runs only the default branch's
  # select_prs.py and never code from the PR.
  merge:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.actor.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.PDT_BOT_TOKEN || github.token }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      DRY_RUN: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - run: python3 ci/claude-tasks/score-prs/select_prs.py
