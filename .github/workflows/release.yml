name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths: ["installer/**"]
  workflow_dispatch:
    inputs:
      sign:
        description: Sign pdt.exe and the MSI and upload them as artifacts. Publishes nothing.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sign: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.sign) && vars.SIGNING_ENDPOINT != '' && vars.SIGNING_ACCOUNT != '' && vars.SIGNING_PROFILE != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: The tag must match the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(uv version --short)" = "${GITHUB_REF_NAME}"

      - run: uv build

      - name: The wheel must hold the package and its examples
        run: uv run --python 3.12 python scripts/smoke.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  windows-launcher:
    needs: build
    runs-on: windows-latest
    environment: ${{ needs.build.outputs.sign == 'true' && 'signing' || '' }}
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.zip.outputs.version }}
      sha256: ${{ steps.zip.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - shell: pwsh
        run: installer/build-launcher.ps1 -Version (uv version --short) -Out dist/launcher/pdt.exe

      - if: needs.build.outputs.sign != 'true'
        run: echo "::notice title=Unsigned::pdt.exe is not signed. Only a release tag or a manual run with sign set is signed, and only when the SIGNING_ENDPOINT, SIGNING_ACCOUNT, and SIGNING_PROFILE variables are set."

      - if: needs.build.outputs.sign == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - if: needs.build.outputs.sign == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\launcher\pdt.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - if: needs.build.outputs.sign == 'true'
        shell: pwsh
        run: |
          $s = Get-AuthenticodeSignature dist\launcher\pdt.exe
          if ($s.Status -ne 'Valid' -or -not $s.TimeStamperCertificate) { throw "pdt.exe signature: $($s.Status) $($s.StatusMessage)" }
          "pdt.exe is signed by $($s.SignerCertificate.Subject)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launcher
          path: dist/launcher/pdt.exe

      - id: zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/launcher/pdt.exe -DestinationPath pdt-windows-x64.zip
          $hash = (Get-FileHash pdt-windows-x64.zip -Algorithm SHA256).Hash
          "version=$(uv version --short)" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-launcher
          path: pdt-windows-x64.zip

      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/launcher/pdt.exe
            pdt-windows-x64.zip

      - if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh release list --repo "${GITHUB_REPOSITORY}" --exclude-pre-releases --exclude-drafts --limit 2 --json tagName --jq "[.[].tagName | select(. != \"${GITHUB_REF_NAME}\")][0] // \"\"")" || previous=""
          if ! uv run --no-project --python 3.12 python ci/release_notes.py "${GITHUB_REPOSITORY}" "${previous}" "${GITHUB_REF_NAME}" > release-notes.md; then
            echo "::warning title=Release notes::ci/release_notes.py failed, so the notes hold at most the changelog link."
            if [ -n "${previous}" ]; then
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}" > release-notes.md
            else
              : > release-notes.md
            fi
          fi

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: pdt-windows-x64.zip
          body_path: release-notes.md

  windows-msi:
    needs: [build, windows-launcher, publish]
    if: ${{ !cancelled() && needs.windows-launcher.result == 'success' }}
    # WiX v7.0.0 builds its ARM64 binaries with the v143 toolset, which only the VS 2022 image has.
    runs-on: windows-2022
    environment: ${{ needs.build.outputs.sign == 'true' && 'signing' || '' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # The README links to releases/latest/download/pdt-windows-x64.msi, so the
      # file name has no version.
      MSI: pdt-windows-x64.msi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: launcher
          path: dist/launcher

      - id: wix
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/wix/bin
          key: wix-${{ hashFiles('installer/build-wix.ps1') }}

      - if: steps.wix.outputs.cache-hit != 'true'
        shell: pwsh
        run: installer/build-wix.ps1 -Out build/wix

      - shell: pwsh
        run: installer/build-msi.ps1 -Wix build/wix/bin/wix.exe -Launcher dist/launcher/pdt.exe -Version ${{ needs.windows-launcher.outputs.version }} -Out ${{ env.MSI }}

      - if: needs.build.outputs.sign != 'true'
        run: echo "::notice title=Unsigned::${{ env.MSI }} is not signed. Only a release tag or a manual run with sign set is signed, and only when the SIGNING_ENDPOINT, SIGNING_ACCOUNT, and SIGNING_PROFILE variables are set."

      - if: needs.build.outputs.sign == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - if: needs.build.outputs.sign == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\${{ env.MSI }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - if: needs.build.outputs.sign == 'true'
        shell: pwsh
        run: |
          $s = Get-AuthenticodeSignature ${{ env.MSI }}
          if ($s.Status -ne 'Valid' -or -not $s.TimeStamperCertificate) { throw "${{ env.MSI }} signature: $($s.Status) $($s.StatusMessage)" }
          "${{ env.MSI }} is signed by $($s.SignerCertificate.Subject)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi
          path: ${{ env.MSI }}

      - if: startsWith(github.ref, 'refs/tags/') && needs.publish.result == 'success'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.MSI }}

      - if: startsWith(github.ref, 'refs/tags/') && needs.publish.result == 'success'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: ${{ env.MSI }}

  wingetcreate:
    if: startsWith(github.ref, 'refs/tags/')
    continue-on-error: true
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    env:
      # Manifest schema 1.28.0 support (microsoft/winget-create#711) is not in a release; v1.12.13.0 is the latest.
      COMMIT: fb3522c2b5a5556ffe0ac70339b7e45b7c616878
    steps:
      - id: find
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifacts = (gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=wingetcreate-$env:COMMIT" | ConvertFrom-Json).artifacts
          $found = $artifacts | Where-Object { -not $_.expired -and $_.workflow_run.head_repository_id -eq $env:GITHUB_REPOSITORY_ID -and $_.workflow_run.head_branch -cmatch '^v[0-9]+\.[0-9]+\.[0-9]+$' } | Select-Object -First 1
          "run-id=$($found.workflow_run.id)" >> $env:GITHUB_OUTPUT

      - id: reuse
        if: steps.find.outputs.run-id
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wingetcreate-${{ env.COMMIT }}
          path: wingetcreate
          run-id: ${{ steps.find.outputs.run-id }}
          github-token: ${{ github.token }}

      - if: steps.reuse.outcome != 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/winget-create
          ref: ${{ env.COMMIT }}
          path: src
          persist-credentials: false

      - if: steps.reuse.outcome != 'success'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: src/global.json

      - if: steps.reuse.outcome != 'success'
        working-directory: src
        run: dotnet publish src/WingetCreateCLI/WingetCreateCLI.csproj -c Release -r win-x64 --self-contained -o ../wingetcreate -p:DebugType=None -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true

      - if: steps.reuse.outcome != 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wingetcreate-${{ env.COMMIT }}
          path: wingetcreate/WingetCreateCLI.exe
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wingetcreate
          path: wingetcreate/WingetCreateCLI.exe

  # WINGET_TOKEN is a classic token with public_repo scope:
  # https://github.com/microsoft/winget-create/blob/main/doc/token.md
  winget:
    needs: [windows-launcher, publish, wingetcreate]
    if: startsWith(github.ref, 'refs/tags/')
    continue-on-error: true
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.windows-launcher.outputs.version }}
      SHA256: ${{ needs.windows-launcher.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - run: uv run --no-project --python 3.12 python scripts/render_winget_manifests.py --version ${{ env.VERSION }} --sha256 ${{ env.SHA256 }} --out winget/rendered

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-manifests
          path: winget/rendered/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wingetcreate

      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) { Write-Error 'WINGET_TOKEN is empty.' }
          gh api repos/microsoft/winget-pkgs/contents/manifests/a/AutoIDM/pdt --silent
          if ($LASTEXITCODE) { Write-Error 'AutoIDM.pdt is not in microsoft/winget-pkgs. Submit the first version by hand from the winget-manifests artifact.' }
          gh api "repos/microsoft/winget-pkgs/contents/manifests/a/AutoIDM/pdt/$env:VERSION" --silent
          if (-not $LASTEXITCODE) { Write-Host "AutoIDM.pdt $env:VERSION is already in microsoft/winget-pkgs."; exit 0 }
          .\WingetCreateCLI.exe submit --no-open winget/rendered
