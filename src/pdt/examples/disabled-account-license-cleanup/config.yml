# Removes direct Entra licenses from disabled accounts.

# How often this app runs.
# Shorthand: hourly, daily, weekly, monthly, yearly.
# Or a 5-field cron expression, for example "0 * * * *".
schedule: "weekly"

config:
  # Replace these July 2026 US list prices with your invoice's monthly rates.
  monthly_license_costs_usd:
    ENTERPRISEPACK: 26
    ENTERPRISEPREMIUM: 41
    SPE_E3: 39
    SPE_E5: 60
  email_to: recipient@example.com
  email_from: sender@example.com
  email_subject: Disabled account license cleanup

# The Entra app needs User.Read.All, LicenseAssignment.Read.All, and
# LicenseAssignment.ReadWrite.All application permissions with admin consent.
env:
  required:
    - PDT_AZURE_TENANT_ID
    - PDT_AZURE_CLIENT_ID
  one_of:
    - [PDT_AZURE_CLIENT_SECRET]
    - [PDT_AZURE_PRIVATE_KEY_B64]
    - [PDT_AZURE_PRIVATE_KEY_PATH]
  optional:
    - PDT_AZURE_PRIVATE_KEY_PASSWORD
    - PDT_SMTP_HOST
    - PDT_SMTP_PORT
    - PDT_SMTP_USER
    - PDT_SMTP_PASSWORD
    - PDT_SMTP_AUTH
    - PDT_SMTP_OAUTH_CLIENT_ID
    - PDT_SMTP_OAUTH_CLIENT_SECRET
    - PDT_SMTP_OAUTH_TENANT_ID
    - PDT_SMTP_OAUTH_CACHE_B64
    - PDT_GRAPH_MAIL_USER
    - PDT_GRAPH_MAIL_CLIENT_ID
    - PDT_GRAPH_MAIL_TENANT_ID
    - PDT_GRAPH_MAIL_CACHE_B64
    - PDT_SES_REGION
    - PDT_SES_ACCESS_KEY_ID
    - PDT_SES_SECRET_ACCESS_KEY
    - PDT_RESEND_API_KEY
