name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: The tag must match the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(uv version --short)" = "${GITHUB_REF_NAME}"

      - run: uv build

      - name: The wheel must hold the package and its examples
        run: uv run --python 3.12 python scripts/smoke.py

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  windows-launcher:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.zip.outputs.version }}
      sha256: ${{ steps.zip.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Stamp the launcher with the release version
        shell: bash
        run: |
          version="$(uv version --short)"
          sed -i "s/^VERSION = \"0.0.0\"$/VERSION = \"${version}\"/" scripts/winget_launcher.py
          grep -qx "VERSION = \"${version}\"" scripts/winget_launcher.py

      - run: uv run --no-project --python 3.12 --with pyinstaller pyinstaller --onefile --name pdt --distpath dist/launcher scripts/winget_launcher.py

      # Signing: azure/artifact-signing-action signs dist/launcher/pdt.exe here, before the zip and the MSI take it.
      - uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: dist/launcher/pdt.exe

      - id: zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/launcher/pdt.exe -DestinationPath pdt-windows-x64.zip
          $hash = (Get-FileHash pdt-windows-x64.zip -Algorithm SHA256).Hash
          "version=$(uv version --short)" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: winget-launcher
          path: pdt-windows-x64.zip

      - if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh release list --repo "${GITHUB_REPOSITORY}" --exclude-pre-releases --exclude-drafts --limit 2 --json tagName --jq "[.[].tagName | select(. != \"${GITHUB_REF_NAME}\")][0] // \"\"")" || previous=""
          if ! uv run --no-project --python 3.12 python ci/release_notes.py "${GITHUB_REPOSITORY}" "${previous}" "${GITHUB_REF_NAME}" > release-notes.md; then
            echo "::warning title=Release notes::ci/release_notes.py failed, so the notes hold at most the changelog link."
            if [ -n "${previous}" ]; then
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}" > release-notes.md
            else
              : > release-notes.md
            fi
          fi

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pdt-windows-x64.zip
          body_path: release-notes.md

  windows-msi:
    needs: [windows-launcher, publish]
    if: ${{ !cancelled() && needs.windows-launcher.result == 'success' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: launcher
          path: dist/launcher

      - id: wix
        uses: actions/cache@v4
        with:
          path: build/wix/bin
          key: wix-${{ hashFiles('installer/build-wix.ps1') }}

      - if: steps.wix.outputs.cache-hit != 'true'
        shell: pwsh
        run: installer/build-wix.ps1 -Out build/wix

      - shell: pwsh
        run: installer/build-msi.ps1 -Wix build/wix/bin/wix.exe -Launcher dist/launcher/pdt.exe -Version ${{ needs.windows-launcher.outputs.version }} -Out pdt-windows-x64.msi

      # Signing: azure/artifact-signing-action signs pdt-windows-x64.msi here.
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: pdt-windows-x64.msi

      - if: startsWith(github.ref, 'refs/tags/') && needs.publish.result == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: pdt-windows-x64.msi

  # The first submission of AutoIDM.pdt is a manual `wingetcreate new` from
  # the rendered manifests in the winget-manifests artifact. WINGET_TOKEN is a
  # GitHub personal access token with public_repo scope on a fork of
  # microsoft/winget-pkgs. A missing token fails only this job.
  winget:
    needs: [windows-launcher, publish]
    if: startsWith(github.ref, 'refs/tags/')
    continue-on-error: true
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.windows-launcher.outputs.version }}
      SHA256: ${{ needs.windows-launcher.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - run: uv run --no-project --python 3.12 python scripts/render_winget_manifests.py --version ${{ env.VERSION }} --sha256 ${{ env.SHA256 }} --out winget/rendered

      - uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: winget/rendered/

      - shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update AutoIDM.pdt --urls "https://github.com/AutoIDM/pdt/releases/download/v$env:VERSION/pdt-windows-x64.zip" --version $env:VERSION --submit --token $env:WINGET_TOKEN
