# The apps: list in verify/pdt.yml is the matrix. One job here per provider.
# Each job deploys to a real cloud account and destroys what it made.

variables:
  # A fake secret. Each app declares it as required, so a deployed job fails
  # unless deploy delivered it as PDT_ENV_JSON.
  PDT_SMOKE_TOKEN: pdt-verify

# The files a cloud run can prove anything about. A merge request or master
# pipeline that changes none of them (docs, the Claude tasks, the unit tests)
# gets no cloud job, so the per-provider queue stays free for the ones that do.
# A schedule always runs.
.verify-paths:
  changes:
    - src/pdt/**/*
    - verify/**/*
    - scripts/**/*
    - pyproject.toml
    - uv.lock
    - .gitlab-ci.yml

.verify:force-merge:
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /(^|,)force-merge(,|$)/
      when: never

verify:
  stage: verify
  image: alpine:3.20
  needs: []
  cache: []
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Starting the verify jobs."
  rules:
    - !reference [".verify:force-merge", rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.verify-paths, changes]
      when: manual
      allow_failure: false
    - !reference [.verify, rules]

.verify:
  stage: verify
  needs: [build, verify]
  # A cancelled run leaks the resources it made, so these never get cancelled.
  interruptible: false
  artifacts:
    when: always
    reports:
      junit: verify-*.xml
  rules:
    - !reference [".verify:force-merge", rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: !reference [.verify-paths, changes]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $mode == null
      changes: !reference [.verify-paths, changes]
    - if: $CI_PIPELINE_SOURCE == "schedule"

.verify:unix:
  extends: .verify
  before_script:
    # PDT_INSTALL points at another build (a git ref, or pdt-cli) when set.
    - if [ -z "$PDT_INSTALL" ]; then PDT_INSTALL="$(ls dist/*.whl)"; fi
    - uv tool install "$PDT_INSTALL"
    - export PATH="$HOME/.local/bin:$PATH"

# Fargate builds for linux/arm64, so the AWS job uses an arm64 runner.
verify:aws:
  extends: .verify:unix
  resource_group: aws
  # Without the account's variables the job cannot log in. It then waits as a
  # manual job, so the pipeline shows the gap instead of failing at login.
  rules:
    - !reference [".verify:force-merge", rules]
    - if: $AWS_ROLE_ARN == null
      when: manual
      allow_failure: true
    - !reference [.verify, rules]
  tags:
    - saas-linux-medium-arm64
  services:
    - docker:28-dind
  # The job trades this token for one hour of AWS credentials. No AWS key is
  # stored anywhere; the role's trust policy names this project.
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    AWS_DEFAULT_REGION: us-east-1
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends docker.io
    - !reference [".verify:unix", before_script]
    - >
      eval "$(pdt aws sts assume-role-with-web-identity
      --role-arn "$AWS_ROLE_ARN" --role-session-name "verify-$CI_JOB_ID"
      --web-identity-token "$GITLAB_OIDC_TOKEN" --duration-seconds 3600
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text
      | awk '{print "export AWS_ACCESS_KEY_ID="$1" AWS_SECRET_ACCESS_KEY="$2" AWS_SESSION_TOKEN="$3}')"
    - pdt aws sts get-caller-identity
  script:
    - uv run --no-project --with pyyaml python verify/scripts/verify.py aws --report verify-aws.xml

verify:azure:
  extends: .verify:unix
  resource_group: azure
  services:
    - docker:28-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    # The subscription allows one Container Apps environment. It is created
    # once by hand and named here, so no run creates or deletes it.
    PDT_AZURE_CONTAINER_APPS_ENVIRONMENT: pdt-shared/pdt-eastus2
  # Without the account's variables the job cannot log in. It then waits as a
  # manual job, so the pipeline shows the gap instead of failing at login.
  rules:
    - !reference [".verify:force-merge", rules]
    - if: $AZURE_CLIENT_ID == null
      when: manual
      allow_failure: true
    - !reference [.verify, rules]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends docker.io
    - !reference [".verify:unix", before_script]
    - pdt az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
  script:
    - uv run --no-project --with pyyaml python verify/scripts/verify.py azure --report verify-azure.xml

verify:google-cloud:
  extends: .verify:unix
  resource_group: google-cloud
  # Without the account's variables the job cannot log in. It then waits as a
  # manual job, so the pipeline shows the gap instead of failing at login.
  rules:
    - !reference [".verify:force-merge", rules]
    - if: $GOOGLE_CLOUD_PROJECT == null || $GOOGLE_APPLICATION_CREDENTIALS == null
      when: manual
      allow_failure: true
    - !reference [.verify, rules]
  variables:
    PDT_GOOGLE_CLOUD_PROJECT: $GOOGLE_CLOUD_PROJECT
  before_script:
    - !reference [".verify:unix", before_script]
    - pdt gcloud auth activate-service-account --key-file "$GOOGLE_APPLICATION_CREDENTIALS"
    - pdt gcloud config set project "$GOOGLE_CLOUD_PROJECT"
  script:
    - uv run --no-project --with pyyaml python verify/scripts/verify.py google-cloud --report verify-google-cloud.xml

# Deploys to the runner's own Task Scheduler, so it needs no cloud credentials.
verify:windows:
  extends: .verify
  resource_group: windows
  inherit:
    default: false
  tags:
    - saas-windows-medium-amd64
  before_script:
    - irm https://astral.sh/uv/install.ps1 | iex
    - $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
    - if (-not $env:PDT_INSTALL) { $env:PDT_INSTALL = (Get-Item dist\*.whl).FullName }
    - uv tool install $env:PDT_INSTALL
  script:
    - $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
    - uv run --no-project --with pyyaml python verify\scripts\verify.py windows --report verify-windows.xml

# Everything the matrix can prove without a cloud account.
verify:check:
  stage: test
  # The local scenario runs real pdt commands, so this job installs the wheel
  # the build job made instead of starting with needs: [].
  needs: [build]
  artifacts:
    when: always
    reports:
      junit: verify-local.xml
  before_script:
    - !reference [".verify:unix", before_script]
  script:
    - uv run --no-project --with pyyaml python verify/scripts/sync_apps.py --check
    - uv run --no-project --with pyyaml python verify/scripts/coverage.py --check
    - PDT_PROJECT=verify uv run pdt validate
    - uv run --no-project --with pyyaml python verify/scripts/verify.py local --report verify-local.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $mode == null
    - if: $CI_COMMIT_TAG
