# Flags one person signing in from two far-apart places too quickly.

# How often this app runs.
# Shorthand: hourly, daily, weekly, monthly, yearly.
# Or a 5-field cron expression, for example "0 * * * *".
schedule: "hourly"

config:
  # How far back to read Entra sign-in logs. Two far logins inside
  # this window count as impossible travel; wider window, more Graph data.
  lookback_hours: 72

  # Ignore short hops. IP geolocation jitters tens of km.
  min_distance_km: 250

  # The title of the alert impossible-travel:found, which carries the findings.
  # To get it by email, in Slack, or in Teams, add impossible-travel:found to the
  # events of an entry under alerts: in the project's pdt.yml (pdt alerts setup).
  subject: Impossible travel detected

# Env vars the app needs. `pdt validate` checks them against your
# .env; `pdt deploy` uploads the ones that are set as cloud secrets.
env:
  required: [PDT_AZURE_TENANT_ID, PDT_AZURE_CLIENT_ID]
  one_of:
    - [PDT_AZURE_CLIENT_SECRET]
    - [PDT_AZURE_PRIVATE_KEY_B64]
    - [PDT_AZURE_PRIVATE_KEY_PATH]
  optional:
    - PDT_AZURE_PRIVATE_KEY_PASSWORD
