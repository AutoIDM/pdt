# Exports the Intune configuration once a week, in the folder layout that
# IntuneManagement (github.com/Micke-K/IntuneManagement) imports, and keeps
# an IntuneExport-<date>.zip in the app's data store each run.

# How often this app runs.
# Shorthand: hourly, daily, weekly, monthly, yearly.
# Or a 5-field cron expression, for example "0 * * * *".
schedule: "weekly"

# Each key below matches an IntuneManagement export setting. The values shown
# are its defaults.
config:
  # The object types to export, by IntuneManagement folder name, for example
  # [DeviceConfiguration, SettingsCatalog]. Empty exports every type.
  object_types: []

  # Export only objects whose name contains this text. Empty exports all.
  name_filter: ""

  # Put each object type in its own folder, and all of them in a folder
  # named for the company. Keep both on to import with IntuneManagement's
  # defaults: point its import at the company folder.
  add_object_type: true
  add_company_name: true

  # Add the object id to each file name, for objects that share a name.
  add_id_to_file_name: false

  # Keep each object's assignments, and list the assigned groups in
  # MigrationTable.json so an import into another tenant can map them.
  export_assignments: true

  # Also write script files, and the file of hardware configuration
  # policies, next to their JSON.
  export_script_content: true
  export_policy_files: true

  # Also download app packages. Intune keeps them encrypted, so this works
  # only for apps uploaded with IntuneManagement's "Save Encryption File"
  # setting. Put those encryption files in this folder, inside the app.
  export_app_files: false
  app_encryption_folder: ""

  # Add the names of referenced objects (for example the certificate of a
  # VPN profile), so an import can link them again.
  resolve_reference_info: true

  # Read up to 20 objects per Microsoft Graph call.
  use_batch_api: false

  # Microsoft Graph version: beta or v1.0. Some object types exist only in
  # beta.
  graph_version: beta

  # Write JSON properties in a fixed order, so two exports compare line by
  # line.
  sort_json_properties: false

# The Entra app needs these Microsoft Graph application permissions, with
# admin consent: DeviceManagementConfiguration.Read.All,
# DeviceManagementApps.Read.All, DeviceManagementServiceConfig.Read.All,
# DeviceManagementRBAC.Read.All, DeviceManagementScripts.Read.All,
# DeviceManagementManagedDevices.Read.All, CloudPC.Read.All, Policy.Read.All,
# Agreement.Read.All, Organization.Read.All, Group.Read.All, User.Read.All.
env:
  required:
    - PDT_AZURE_TENANT_ID
    - PDT_AZURE_CLIENT_ID
    - PDT_AZURE_CLIENT_SECRET
