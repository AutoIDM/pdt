# Fails a pull request that adds a dependency with a known vulnerability, so
# it is found before the merge. It reads what GitHub's dependency graph reads
# (uv.lock and the workflow pins), not the PEP 723 script headers.

name: dependency-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
