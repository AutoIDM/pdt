<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}pdt{% endblock %} · {{ project_name }}</title>
    <link rel="stylesheet" href="{% url 'static_file' 'pdt.css' %}">
</head>
<body>
<header class="top">
    <a class="brand" href="{% url 'index' %}">pdt</a>
    <span class="project" title="{{ project.path }}">{{ project_name }}</span>
    <nav>{% block crumbs %}{% endblock %}</nav>
    <a class="stats-link" href="{% url 'stats' %}">Stats</a>
</header>
<main>
    {% if messages %}
    <div class="messages">
        {% for message in messages %}<pre class="msg {{ message.tags }}">{{ message }}</pre>{% endfor %}
    </div>
    {% endif %}
    {% block content %}{% endblock %}
</main>
<script>
    // Every shown command gets a copy button. data-copy holds the text, or the
    // element's own text when it is empty (the workbench line changes as you type).
    document.querySelectorAll("[data-copy]").forEach(function (element) {
        var button = document.createElement("button");
        button.type = "button";
        button.className = "copy";
        button.textContent = "copy";
        button.setAttribute("aria-label", "Copy the command");
        button.addEventListener("click", function () {
            navigator.clipboard.writeText(element.dataset.copy || element.textContent).then(function () {
                button.textContent = "copied";
                button.classList.add("done");
                setTimeout(function () { button.textContent = "copy"; button.classList.remove("done"); }, 1200);
            });
        });
        element.insertAdjacentElement("afterend", button);
    });
</script>
</body>
</html>
